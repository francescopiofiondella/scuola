<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Istituto Caso 3D</title>
<style>
:root{--bg:#0f1720;--ink:#e8eef5;--muted:#9fb1c3;--accent:#ffd400;--card:#16232f;--line:#2a3b4b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,'Segoe UI',sans-serif;padding:24px 16px}
main{max-width:720px;width:100%}
h1{font-size:clamp(28px,6vw,44px);line-height:1.05;margin:0 0 8px}
p{color:var(--muted);margin:0 0 24px}
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
a{display:block;background:var(--card);border:1px solid var(--line);border-bottom:4px solid var(--accent);color:var(--ink);text-decoration:none;padding:18px;border-radius:10px;font-weight:700}
a span{display:block;font-weight:400;font-size:13px;color:var(--muted);margin-top:4px}
a:hover,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>Istituto Caso</h1>
  <p>Passeggiata 3D della scuola e pannello per le LIM.</p>
  <div class="cards">
    <a href="caso.html">Passeggiata 3D<span>Versione normale</span></a>
    <a href="halloween.html">Versione Halloween<span>Stessa scuola, a tema</span></a>
    <a href="gestione.html">Gestione LIM<span>Immagini e siti degli schermi</span></a>
  </div>
</main>
</body>
</html>
